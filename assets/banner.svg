<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="bullpen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- subtle baseline rule -->
  <line x1="180" y1="200" x2="1020" y2="200" stroke="#1f232c" stroke-width="1"/>

  <!-- wordmark -->
  <text x="600" y="180"
        text-anchor="middle"
        font-family="ui-serif, 'Iowan Old Style', 'Apple Garamond', Georgia, 'Times New Roman', serif"
        font-size="180"
        font-weight="500"
        letter-spacing="-6"
        fill="url(#ink)"
        filter="url(#glow)">bullpen</text>
</svg>
